name: Secret Audit Shield (GitGuardian Defense)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Audit Repository for Exposed Secrets & Bearer Tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Secret Audit Scanner
        run: node scan_secrets.js
